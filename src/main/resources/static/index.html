<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 550px;
            text-align: center;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #888;
            margin-bottom: 35px;
            font-size: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0px);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 12px;
            display: none;
        }

        .result p {
            color: #555;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .short-url {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
            word-break: break-all;
            text-decoration: none;
        }

        .short-url:hover {
            text-decoration: underline;
        }

        .copy-btn {
            margin-top: 12px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            background: #fff0f0;
            border-radius: 12px;
            color: #e74c3c;
            display: none;
            font-size: 14px;
        }

        .loading {
            display: none;
            margin-top: 20px;
            color: #667eea;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">🔗</div>
    <h1>URL Shortener</h1>
    <p class="subtitle">Paste your long URL and get a short one instantly!</p>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Enter your long URL here..." />
        <button onclick="shortenUrl()">⚡ Shorten URL</button>
    </div>

    <div class="loading" id="loading">⏳ Shortening your URL...</div>

    <div class="error" id="error"></div>

    <div class="result" id="result">
        <p>✅ Your shortened URL is ready!</p>
        <a class="short-url" id="shortUrl" href="#" target="_blank"></a>
        <br>
        <button class="copy-btn" onclick="copyUrl()">📋 Copy URL</button>
    </div>
</div>

<script>
    async function shortenUrl() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const loadingDiv = document.getElementById('loading');
        const shortUrlEl = document.getElementById('shortUrl');

        // Hide previous results
        resultDiv.style.display = 'none';
        errorDiv.style.display = 'none';

        // Validate input
        if (!urlInput) {
            errorDiv.textContent = '⚠️ Please enter a URL!';
            errorDiv.style.display = 'block';
            return;
        }

        // Show loading
        loadingDiv.style.display = 'block';

        try {
            const response = await fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();
            loadingDiv.style.display = 'none';

            if (response.ok) {
                shortUrlEl.textContent = data.shortUrl;
                shortUrlEl.href = data.shortUrl;
                resultDiv.style.display = 'block';
            } else {
                errorDiv.textContent = '❌ Something went wrong. Please try again!';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            loadingDiv.style.display = 'none';
            errorDiv.textContent = '❌ Could not connect to server. Make sure the app is running!';
            errorDiv.style.display = 'block';
        }
    }

    function copyUrl() {
        const shortUrl = document.getElementById('shortUrl').textContent;
        navigator.clipboard.writeText(shortUrl);
        alert('✅ URL copied to clipboard!');
    }

    // Allow pressing Enter to shorten
    document.getElementById('urlInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') shortenUrl();
    });
</script>

</body>
</html>
